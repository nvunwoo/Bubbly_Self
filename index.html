<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141626">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="눈 내리는 밤, 우리 둘을 위한 작은 크리스마스 마을.">
  <title>Bubbly Self · 우리 둘의 크리스마스</title>
  <link rel="icon" href="/assets/spark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/carousel.js" defer></script>
</head>
<body>
  <div class="scenery" aria-hidden="true">
    <div class="village"></div>
    <div class="stars"></div>
    <div class="meteor"></div>
    <div class="snow snow-far"></div>
  </div>
  <div class="snow snow-near" aria-hidden="true"></div>

  <main class="home">
    <section class="carousel" aria-label="크리스마스 회전목마">
      <div class="ride">
        <div class="ride-frame">
          <div class="ride-glow" aria-hidden="true"></div>
          <svg class="machine" viewBox="0 0 600 540" aria-hidden="true">
            <defs>
              <linearGradient id="floor" x2="0" y2="1" gradientUnits="objectBoundingBox">
                <stop stop-color="#9a494e"/><stop offset="1" stop-color="#612d42"/>
              </linearGradient>
              <linearGradient id="base" x2="0" y2="1" gradientUnits="objectBoundingBox">
                <stop stop-color="#a34c5c"/><stop offset="1" stop-color="#38182e"/>
              </linearGradient>
              <linearGradient id="gold" x2="0" y2="1" gradientUnits="objectBoundingBox">
                <stop stop-color="#fff0bd"/><stop offset=".48" stop-color="#e6aa71"/><stop offset="1" stop-color="#9f5b52"/>
              </linearGradient>
              <linearGradient id="column">
                <stop stop-color="#773d50"/><stop offset=".25" stop-color="#bf785f"/><stop offset=".52" stop-color="#efc28d"/><stop offset=".78" stop-color="#b76c60"/><stop offset="1" stop-color="#74394d"/>
              </linearGradient>
              <linearGradient id="red" x2="0" y2="1" gradientUnits="objectBoundingBox">
                <stop stop-color="#e67980"/><stop offset="1" stop-color="#8f344b"/>
              </linearGradient>
              <linearGradient id="cream" x2="0" y2="1" gradientUnits="objectBoundingBox">
                <stop stop-color="#fff4d9"/><stop offset="1" stop-color="#d8a485"/>
              </linearGradient>
              <radialGradient id="shadow">
                <stop stop-color="#20172a" stop-opacity=".9"/><stop offset=".7" stop-color="#2d2136" stop-opacity=".6"/><stop offset="1" stop-color="#2d2136" stop-opacity="0"/>
              </radialGradient>
              <radialGradient id="snow-light">
                <stop stop-color="#fed0ad" stop-opacity=".53"/><stop offset=".56" stop-color="#eeb9a0" stop-opacity=".25"/><stop offset="1" stop-color="#eeb9a0" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <ellipse cx="300" cy="512" rx="298" ry="48" fill="url(#snow-light)"/>
            <ellipse cx="300" cy="513" rx="279" ry="36" fill="url(#shadow)"/>
            <g transform="translate(0 90)">
              <path d="M53 376v20c0 24 110 43 247 43s247-19 247-43v-20Z" fill="url(#base)" stroke="#2c1b31" stroke-width="2"/>
              <ellipse cx="300" cy="375" rx="247" ry="42" fill="url(#floor)" stroke="#efbb8b" stroke-width="3"/>
              <ellipse cx="300" cy="375" rx="224" ry="33" fill="none" stroke="#edab86" stroke-opacity=".45"/>
              <path d="M54 390c18 21 121 36 246 36s228-15 246-36" fill="none" stroke="#d88f6d" stroke-width="2"/>
              <g class="floor-spokes"></g>
              <g class="floor-lights"></g>
            </g>
            <path d="M66 496q10 9 32 14m19 4 12 3m362-10q14-5 25-12m-41 18-8 2" fill="none" stroke="#f6dcd4" stroke-opacity=".47" stroke-width="2" stroke-linecap="round"/>
            <path d="M271 459v7c0 10 58 10 58 0v-7Z" fill="url(#base)" stroke="#d99c75" stroke-width="2"/>
            <ellipse cx="300" cy="459" rx="29" ry="8" fill="url(#gold)"/>
            <path d="M279 143h42v314c0 8-42 8-42 0Z" fill="url(#column)" stroke="#e9ab7e" stroke-width="2"/>
            <path d="M290 151v306m17-306v306" stroke="#ffe4b2" stroke-width="2" opacity=".56"/>
            <rect x="275" y="163" width="50" height="10" rx="4" fill="url(#gold)" stroke="#94545a" stroke-width="1.5"/>
            <g class="poles"></g>
          </svg>

          <div class="cards">
            <div class="slot is-current" data-index="0">
              <a class="card" href="/Capsule_Letter" aria-label="캡슐 편지 열기">
                <img src="/assets/capsule.svg" width="240" height="238" alt="" draggable="false" fetchpriority="high">
                <span class="card-caption"><strong>캡슐 편지</strong></span>
              </a>
            </div>
            <div class="slot" data-index="1">
              <button class="card" type="button" aria-label="산타의 질문, 준비 중">
                <img src="/assets/santa.svg" width="240" height="238" alt="" draggable="false">
                <span class="ribbon" aria-hidden="true">Coming soon!</span>
                <span class="card-caption"><strong>산타의 질문</strong></span>
              </button>
            </div>
            <div class="slot" data-index="2">
              <button class="card" type="button" aria-label="인형 뽑기, 준비 중">
                <img src="/assets/claw.svg" width="240" height="238" alt="" draggable="false">
                <span class="ribbon" aria-hidden="true">Coming soon!</span>
                <span class="card-caption"><strong>인형 뽑기</strong></span>
              </button>
            </div>
            <div class="slot" data-index="3">
              <button class="card" type="button" aria-label="데이트 신청, 준비 중">
                <img src="/assets/date.svg" width="240" height="238" alt="" draggable="false">
                <span class="ribbon" aria-hidden="true">Coming soon!</span>
                <span class="card-caption"><strong>데이트 신청</strong></span>
              </button>
            </div>
            <div class="slot" data-index="4">
              <button class="card" type="button" aria-label="데이트 이상형 월드컵, 준비 중">
                <img src="/assets/trophy.svg" width="240" height="238" alt="" draggable="false">
                <span class="ribbon" aria-hidden="true">Coming soon!</span>
                <span class="card-caption"><strong><span>데이트</span> <span>이상형 월드컵</span></strong></span>
              </button>
            </div>
          </div>

          <svg class="canopy" viewBox="0 0 600 540" aria-hidden="true">
            <ellipse cx="300" cy="133" rx="249" ry="31" fill="#542a42" stroke="#c48074" stroke-width="2"/>
            <path d="M51 128c47-16 149-44 234-97 9-6 21-6 30 0 85 53 187 81 234 97-19 24-121 37-249 37S70 152 51 128Z" fill="url(#red)"/>
            <g class="roof-panels"></g>
            <g class="roof-trim"></g>
            <path d="M256 52c15-9 25-16 33-21 7-5 15-5 22 0 8 5 18 12 33 21-9 3-15-5-23-1-8 4-14-7-21-4-8 3-15 8-22 3-6-4-15 5-22 2Z" fill="#fff0dd"/>
            <path d="M300 4c2 9 5 12 14 14-9 2-12 5-14 14-2-9-5-12-14-14 9-2 12-5 14-14Z" fill="#ffdf9e" stroke="#fff0bd" stroke-width="1.5"/>
            <circle cx="300" cy="122" r="17" fill="#75394f" stroke="#f4c999" stroke-width="2"/>
            <path d="M300 131c-16-10-7-20 0-13 7-7 16 3 0 13Z" fill="#ffe0ab"/>
          </svg>
        </div>
      </div>

      <div class="controls" hidden>
        <button type="button" class="turn previous" aria-label="이전 카드"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6l-6 6 6 6"/></svg></button>
        <div class="selection">
          <div class="stops" aria-label="카드 선택">
            <button type="button" aria-label="캡슐 편지 선택" aria-current="true"></button>
            <button type="button" aria-label="산타의 질문 선택"></button>
            <button type="button" aria-label="인형 뽑기 선택"></button>
            <button type="button" aria-label="데이트 신청 선택"></button>
            <button type="button" aria-label="데이트 이상형 월드컵 선택"></button>
          </div>
        </div>
        <button type="button" class="turn next" aria-label="다음 카드"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6l6 6-6 6"/></svg></button>
      </div>
      <p class="visually-hidden" role="status"></p>
    </section>
  </main>

</body>
</html>
